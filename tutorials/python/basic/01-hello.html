    <p class="mi-lead">Python 代码无需编译，写好即可由解释器执行。</p>

  <section class="points glass glass--liquid">
    <h2>知识点</h2>
    <ul>
      <li><code>print()</code> 把内容输出到屏幕。</li>
      <li>语句结尾不需要分号，靠缩进划分代码块。</li>
      <li><code>#</code> 开头的是注释，不会被执行。</li>
    </ul>
  </section>

  <section class="code-box" data-lang="python">
    <div class="code-head">
      <span class="name">hello.py</span>
      <span class="spacer"></span>
      <button class="code-btn js-run" type="button">运行</button>
      <button class="code-btn js-copy" type="button">复制</button>
    </div>
    <div class="code-scroll"><pre class="code"># 我的第一个 Python 程序
print("Hello, World!")
print("Python", "很有趣")</pre></div>
