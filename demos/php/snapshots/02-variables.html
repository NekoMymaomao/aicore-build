<head>

<style>
body{margin:0;padding:16px 18px;background:#fff;color:#1f2430;

<h3>var_dump 能看到变量的类型和值</h3><pre>string(6) "小明"
int(18)
float(1.75)

</pre><h3>变量可以直接写进双引号字符串里</h3><p>小明 今年 18 岁，身高 1.75 米。</p><p>是否学生：是</p>
