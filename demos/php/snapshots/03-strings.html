<h3>Hello, World!</h3><p>单引号：$lang 就是四个字母加一个符号。</p><p>双引号：PHP 会被替换成 PHP。</p><h3>常用的字符串函数</h3><ul><li>原字符串 <code>  hello php  </code>，长度 13</li><li>trim 去掉首尾空格后长度 9，内容 <code>hello php</code></li><li>strtoupper 转成大写：<code>HELLO PHP</code></li><li>ucfirst 首字母大写：<code>Hello php</code></li><li>str_replace 替换：<code>hello PHP</code></li><li>str_repeat 重复三遍：<code>ababab</code></li></ul>
