<style>
  * { box-sizing: border-box; }

         font: 16px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }

  a { color: #2563eb; }

  .points h2 { font-size: 15px; color: #7c3aed; margin: 14px 0 6px; }

<body>
<div class="wrap">
  <h1>06 · 循环</h1>
  <p class="lead">重复的事情交给循环去做——改一个数字，就能少写几十行代码。</p>

  <section class="points">
    <h2>知识点</h2>
    <ul>
      <li><code>for</code>：已知要循环几次时用，括号里是「初始值；继续的条件；每轮之后做什么」。</li>
      <li><code>while</code>：条件成立就一直循环。<strong>一定要让条件最终能变成假</strong>，否则就是死循环。</li>
      <li><code>foreach</code>：专门遍历数组，写起来最省事。</li>
      <li><code>break</code> 立刻跳出整个循环，<code>continue</code> 跳过本轮、继续下一轮。</li>
    </ul>
  </section>

  <section class="demo">
    <div class="code-box">
      <div class="code-head">
        <span>examples/06-loops.php</span>
        <span class="spacer"></span>
        <button class="btn btn-reload">重新加载</button>
        <button class="btn btn-copy">复制</button>
      </div>
      <textarea class="code" readonly spellcheck="false" data-source="examples/06-loops.php">&lt;?php
echo &quot;&lt;h3&gt;for：已知要循环几次&lt;/h3&gt;&quot;;
echo &quot;&lt;ul&gt;&quot;;
for ($i = 1; $i &lt;= 5; $i++) {
    echo &quot;&lt;li&gt;第 $i 次循环&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;

echo &quot;&lt;h3&gt;while：条件成立就一直循环&lt;/h3&gt;&quot;;
$countdown = 3;
echo &quot;&lt;ul&gt;&quot;;
while ($countdown &gt; 0) {
    echo &quot;&lt;li&gt;倒计时 $countdown&lt;/li&gt;&quot;;
    $countdown--;
}
echo &quot;&lt;/ul&gt;&quot;;

echo &quot;&lt;h3&gt;foreach：专门用来遍历数组&lt;/h3&gt;&quot;;
$scores = [
    &quot;语文&quot; =&gt; 92,
    &quot;数学&quot; =&gt; 88,
    &quot;英语&quot; =&gt; 95,
];
echo &quot;&lt;ul&gt;&quot;;
foreach ($scores as $subject =&gt; $score) {
    // 变量后面紧跟着中文时要写成 {$变量}，否则中文会被当成变量名的一部分
    echo &quot;&lt;li&gt;{$subject}：{$score} 分&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;

echo &quot;&lt;h3&gt;break 提前跳出循环&lt;/h3&gt;&quot;;
echo &quot;&lt;ul&gt;&quot;;
for ($i = 1; $i &lt;= 10; $i++) {
    if ($i &gt; 3) {
        break;   // 到 4 就跳出整个循环
    }
    echo &quot;&lt;li&gt;$i&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;

echo &quot;&lt;h3&gt;continue 跳过本次&lt;/h3&gt;&quot;;
echo &quot;&lt;ul&gt;&quot;;
for ($i = 1; $i &lt;= 5; $i++) {
    if ($i === 3) {
        continue;   // 跳过 3，继续后面的
    }
    echo &quot;&lt;li&gt;$i&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;</textarea>
    </div>
    <div class="preview-box">
      <div class="preview-head">预览 · 服务器真实执行这段代码后的输出</div>
      <iframe src="snapshots/06-loops.html" data-preview="snapshots/06-loops.html" style="min-height: 460px" title="演示"></iframe>
    </div>
  </section>

<script>
  document.querySelectorAll('.demo').forEach(function (box) {
    var ta = box.querySelector('textarea.code');
    var frame = box.querySelector('iframe');

    box.querySelector('.btn-reload').onclick = function () {
      frame.src = frame.getAttribute('data-preview');
    };
    box.querySelector('.btn-copy').onclick = function () {
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.setSelectionRange(0, 0);
      var btn = this;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    };
  });
</script>
