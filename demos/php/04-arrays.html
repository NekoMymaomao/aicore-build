<body>
<div class="wrap">
  <h1>04 · 数组</h1>
  <p class="lead">数组把一组相关的数据放在一个变量里，是 PHP 里最常用的数据结构。</p>

  <section class="points">
    <h2>知识点</h2>
    <ul>
      <li><strong>索引数组</strong>：键是从 0 开始的数字，<code>$fruits[0]</code> 取第一个。</li>
      <li><strong>关联数组</strong>：键是自己起的名字，<code>$user["name"]</code> 按名字取值。</li>
      <li><code>count()</code> 数元素个数，<code>$arr[] = 值</code> 在末尾追加一个元素，<code>implode()</code> 把数组拼成一个字符串。</li>
      <li><code>foreach</code> 遍历数组：只要值就写 <code>as $值</code>，同时要键和值就写 <code>as $键 =&gt; $值</code>。</li>
    </ul>
  </section>

  <section class="demo">
    <div class="code-box">
      <div class="code-head">
        <span>examples/04-arrays.php</span>
        <span class="spacer"></span>
        <button class="btn btn-reload">重新加载</button>
        <button class="btn btn-copy">复制</button>
      </div>
      <textarea class="code" readonly spellcheck="false" data-source="examples/04-arrays.php">&lt;?php
// 索引数组：键是从 0 开始的数字
$fruits = [&quot;苹果&quot;, &quot;香蕉&quot;, &quot;橙子&quot;];

echo &quot;&lt;h3&gt;索引数组&lt;/h3&gt;&quot;;
echo &quot;&lt;p&gt;第 2 个元素是 &lt;strong&gt;&quot; . $fruits[1] . &quot;&lt;/strong&gt;，一共 &quot; . count($fruits) . &quot; 个元素。&lt;/p&gt;&quot;;
echo &quot;&lt;ul&gt;&quot;;
foreach ($fruits as $fruit) {
    echo &quot;&lt;li&gt;$fruit&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;

// 关联数组：键是自己起的名字
$user = [
    &quot;name&quot; =&gt; &quot;小明&quot;,
    &quot;age&quot;  =&gt; 18,
    &quot;city&quot; =&gt; &quot;杭州&quot;,
];

echo &quot;&lt;h3&gt;关联数组&lt;/h3&gt;&quot;;
echo &quot;&lt;p&gt;用键取值：&quot; . $user[&quot;name&quot;] . &quot;，来自&quot; . $user[&quot;city&quot;] . &quot;，今年 &quot; . $user[&quot;age&quot;] . &quot; 岁。&lt;/p&gt;&quot;;
echo &quot;&lt;ul&gt;&quot;;
foreach ($user as $key =&gt; $value) {
    echo &quot;&lt;li&gt;&lt;code&gt;$key&lt;/code&gt; =&gt; $value&lt;/li&gt;&quot;;
}
echo &quot;&lt;/ul&gt;&quot;;

// 往数组里追加
$fruits[] = &quot;葡萄&quot;;
echo &quot;&lt;h3&gt;追加一个元素&lt;/h3&gt;&quot;;
echo &quot;&lt;p&gt;现在是：&quot; . implode(&quot;、&quot;, $fruits) . &quot;&lt;/p&gt;&quot;;</textarea>
    </div>
    <div class="preview-box">
      <div class="preview-head">预览 · 服务器真实执行这段代码后的输出</div>
      <iframe src="snapshots/04-arrays.html" data-preview="snapshots/04-arrays.html" style="min-height: 380px" title="演示"></iframe>
    </div>
  </section>

</div>

<script>
  document.querySelectorAll('.demo').forEach(function (box) {
    var ta = box.querySelector('textarea.code');
    var frame = box.querySelector('iframe');

    box.querySelector('.btn-reload').onclick = function () {
      frame.src = frame.getAttribute('data-preview');
    };
    box.querySelector('.btn-copy').onclick = function () {
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.setSelectionRange(0, 0);
      var btn = this;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    };
  });
</script>
