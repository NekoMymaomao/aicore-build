<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 链接 · HTML 基础教程</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f5f7fb; color: #1f2430;
         font: 16px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; }
  a { color: #2563eb; }
  h1 { font-size: 24px; margin: 18px 0 6px; }
  .lead { margin: 0 0 18px; color: #5b6472; }
  .points { background: #fff; border: 1px solid #e3e7ef; border-radius: 10px; padding: 6px 20px 14px; margin: 0 0 18px; }
  .points h2 { font-size: 15px; color: #2563eb; margin: 14px 0 6px; }
  .points ul { margin: 0; padding-left: 20px; }
  .points li { margin: 4px 0; }
  code { background: #eef2ff; color: #3730a3; padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .code-box { background: #1e2333; border-radius: 10px; overflow: hidden; }
  .code-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #171b28; color: #9aa4c0; font-size: 13px; }
  .code-head .spacer { flex: 1; }
  .btn { background: #2c3350; color: #dfe4f2; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #3a4468; }
  textarea.code { display: block; width: 100%; border: 0; outline: none; resize: vertical;
                  background: transparent; color: #e6e9f2; padding: 14px; min-height: 110px;
                  font: 13.5px/1.6 ui-monospace, Consolas, "Courier New", monospace; }
  .preview-box { background: #fff; border: 1px solid #e3e7ef; border-radius: 10px; margin-top: 14px; overflow: hidden; }
  .preview-head { padding: 8px 12px; border-bottom: 1px solid #eef1f6; color: #6b7280; font-size: 13px; }
  iframe { display: block; width: 100%; border: 0; min-height: 180px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin: 26px 0 6px; font-size: 14px; }
  .pager .off { color: #9aa4c0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>04 · 链接</h1>
  <p class="lead">链接是网页之间互相连通的通道，靠 <code>&lt;a&gt;</code> 标签和它的 <code>href</code> 属性实现。</p>

  <section class="points">
    <h2>知识点</h2>
    <ul>
      <li><code>href</code> 是要跳转的地址，写在开始标签里，这种写法叫「属性」，格式为 <code>名字="值"</code>。</li>
      <li>加 <code>target="_blank"</code> 会在新标签页打开。搭配 <code>rel="noopener"</code> 更安全。</li>
      <li>地址以 <code>#</code> 开头是「页内锚点」，跳到本页中 <code>id</code> 同名的元素处。</li>
      <li>链接文字要写清楚去哪，别用「点这里」这类看不出目的的文字。</li>
    </ul>
  </section>

  <section class="demo">
    <div class="code-box">
      <div class="code-head">
        <span>links.html</span>
        <span class="spacer"></span>
        <button class="btn btn-run">运行</button>
        <button class="btn btn-reset">重置</button>
        <button class="btn btn-copy">复制</button>
      </div>
<textarea class="code" spellcheck="false">&lt;p&gt;普通链接：&lt;a href="https://developer.mozilla.org/zh-CN/"&gt;MDN 前端文档&lt;/a&gt;&lt;/p&gt;

&lt;p&gt;新标签页打开：&lt;a href="https://example.com" target="_blank" rel="noopener"&gt;example.com&lt;/a&gt;&lt;/p&gt;

&lt;p&gt;页内跳转：&lt;a href="#bottom"&gt;跳到本页底部&lt;/a&gt;&lt;/p&gt;

&lt;div style="height: 180px"&gt;&lt;/div&gt;

&lt;p id="bottom"&gt;这里是页面底部，上面的锚点链接会跳到这里。&lt;/p&gt;</textarea>
    </div>
    <div class="preview-box">
      <div class="preview-head">预览 · 点链接试试看（演示框里滚动一下就能看到跳转效果）</div>
      <iframe title="演示" style="min-height: 260px"></iframe>
    </div>
  </section>

  <nav class="pager">
    <a href="03-text.html">← 上一课</a>
    <a href="index.html">返回目录</a>
    <a href="05-images.html">下一课 →</a>
  </nav>
</div>

<script>
  // 代码框与预览框联动：修改代码后点「运行」重新渲染
  function runDemo(box) {
    var ta = box.querySelector('textarea.code');
    var frame = box.querySelector('iframe');
    var code = ta.value.trim();
    // 若只是一段片段，就自动包上完整文档结构，保证能独立渲染
    frame.srcdoc = /<!doctype|<html[\s>]/i.test(code)
      ? code
      : '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
        '<style>body{margin:0;padding:14px;font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2430}</style>' +
        '</head><body>' + code + '</body></html>';
  }

  document.querySelectorAll('.demo').forEach(function (box) {
    var ta = box.querySelector('textarea.code');
    var first = ta.value;

    box.querySelector('.btn-run').onclick = function () { runDemo(box); };
    box.querySelector('.btn-reset').onclick = function () { ta.value = first; runDemo(box); };
    box.querySelector('.btn-copy').onclick = function () {
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.setSelectionRange(0, 0);
      var btn = this;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    };
    ta.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runDemo(box);
    });

    runDemo(box);
  });
</script>
</body>
</html>
